<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Time Manager · Maquettes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif; }
    .card { @apply rounded-2xl bg-white p-5; }
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-full bg-neutral-900 px-5 py-2.5 text-sm font-semibold whitespace-nowrap text-white; }
    .btn-o { @apply inline-flex items-center justify-center gap-2 rounded-full border-2 border-neutral-900 bg-white px-5 py-2.5 text-sm font-semibold whitespace-nowrap; }
    .btn-s { @apply inline-flex items-center justify-center gap-1 rounded-lg bg-neutral-100 px-3 py-1.5 text-xs font-medium whitespace-nowrap; }
    .chip { @apply inline-block rounded-full bg-neutral-100 px-2.5 py-1 text-xs font-medium whitespace-nowrap; }
    .chip-d { @apply inline-block rounded-full bg-neutral-900 px-2.5 py-1 text-xs font-medium whitespace-nowrap text-white; }
    .chip-r { @apply inline-block rounded-full bg-red-50 px-2.5 py-1 text-xs font-medium whitespace-nowrap text-red-600; }
    .chip-g { @apply inline-block rounded-full bg-green-50 px-2.5 py-1 text-xs font-medium whitespace-nowrap text-green-700; }
    .field { @apply mt-1 w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-sm text-neutral-500; }
    .note { @apply rounded-xl border-l-4 border-neutral-900 bg-white px-4 py-2 text-sm; }
    [data-lucide] { width: 1.15em; height: 1.15em; flex-shrink: 0; }
  </style>
</head>
<body class="w-max bg-neutral-300 p-12 font-sans text-neutral-900">
  <div id="app"></div>

<script>
const stat = (icon, label, value, hint) => `<div class="rounded-2xl bg-white p-4 @3xl:p-5"><div class="mb-4 flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100"><i data-lucide="${icon}"></i></div><p class="text-sm text-neutral-500">${label}</p><p class="mt-1 text-2xl font-semibold @3xl:text-3xl">${value}</p><p class="mt-2 text-xs text-neutral-400">${hint}</p></div>`
const stats = (...list) => `<div class="grid grid-cols-2 gap-4 @3xl:grid-cols-4 @3xl:gap-6">${list.map(s => stat(...s)).join('')}</div>`
const table = (head, rows) => `<div class="overflow-x-auto"><table class="w-full min-w-max text-sm"><thead><tr class="bg-neutral-50 text-left text-neutral-500">${head.map(h => `<th class="px-3 py-3 font-medium first:rounded-l-lg last:rounded-r-lg">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr class="border-b border-neutral-100 last:border-0">${r.map((c, i) => `<td class="px-3 py-3 ${i ? '' : 'font-medium'}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
const chip = t => `<span class="chip">${t}</span>`
const dark = t => `<span class="chip-d">${t}</span>`
const red = t => `<span class="chip-r">${t}</span>`
const green = t => `<span class="chip-g">${t}</span>`
const toggle = on => `<span class="inline-flex h-5 w-9 items-center rounded-full px-0.5 ${on ? 'justify-end bg-neutral-900' : 'justify-start bg-neutral-300'}"><span class="h-4 w-4 rounded-full bg-white"></span></span>`
const ic = name => `<i data-lucide="${name}"></i>`
const bars = values => `<div class="flex h-40 items-end gap-3">${values.map(([l, v, light]) => `<div class="flex h-full flex-1 flex-col items-center justify-end gap-2"><div class="w-full rounded ${light ? 'bg-neutral-400' : 'bg-neutral-900'}" style="height:${v}%"></div><span class="text-xs text-neutral-400">${l}</span></div>`).join('')}</div>`
const setting = (title, text, control) => `<div class="flex items-center justify-between gap-4 border-b border-neutral-100 py-3 last:border-0"><div><p class="text-sm font-medium">${title}</p><p class="text-xs text-neutral-500">${text}</p></div>${control}</div>`
const value = t => `<span class="rounded-lg border border-neutral-200 px-3 py-1.5 text-sm font-semibold whitespace-nowrap">${t}</span>`

const select = t => `<span class="ml-auto inline-flex items-center gap-2 rounded-lg border border-neutral-200 px-3 py-1.5 text-sm text-neutral-600">${t} ${ic('chevron-down')}</span>`
const chartCard = (icon, color, title, subtitle, type, body) => `<div class="rounded-2xl bg-white p-5 shadow-sm"><div class="flex flex-wrap items-center gap-4"><div class="flex h-10 w-10 items-center justify-center rounded-xl ${color}">${ic(icon)}</div><div><p class="font-semibold">${title}</p><p class="text-sm text-neutral-400">${subtitle}</p></div>${select(type)}</div><div class="mt-6">${body}</div></div>`
const secTitle = (icon, t) => `<div class="mb-4 flex items-center gap-3 text-neutral-500">${ic(icon)}<h2 class="text-lg font-bold text-neutral-900">${t}</h2></div>`
const legend = items => `<div class="mb-3 flex flex-wrap justify-end gap-4 text-xs text-neutral-500">${items.map(([c, l]) => `<span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full" style="background:${c}"></span>${l}</span>`).join('')}</div>`
const lineChart = (labels, a, b) => {
  const x = i => 30 + i * (360 / (labels.length - 1))
  const y = v => 150 - v / 24 * 140
  const pts = list => list.map((v, i) => `${x(i)},${y(v)}`).join(' ')
  const dots = (list, c) => list.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${c}"/>`).join('')
  return legend([['#10b981', 'Clock In'], ['#ef4444', 'Clock Out']]) + `<svg viewBox="0 0 400 175" class="w-full">${[0, 8, 16, 24].map(h => `<line x1="30" x2="395" y1="${y(h)}" y2="${y(h)}" stroke="#f1f5f9"/><text x="0" y="${y(h) + 4}" font-size="10" fill="#9ca3af">${h}h</text>`).join('')}<polyline points="${pts(a)}" fill="none" stroke="#10b981" stroke-width="2.5"/><polyline points="${pts(b)}" fill="none" stroke="#ef4444" stroke-width="2.5"/>${dots(a, '#10b981')}${dots(b, '#ef4444')}${labels.map((l, i) => `<text x="${x(i)}" y="170" font-size="9" fill="#9ca3af" text-anchor="middle">${l}</text>`).join('')}</svg>`
}
const colBars = (labels, series, max, colors, names) => (names ? legend(names.map((n, i) => [colors[i], n])) : '') + `<div class="flex h-44 items-end gap-2 @3xl:gap-3">${labels.map((l, i) => `<div class="flex h-full flex-1 flex-col justify-end gap-2"><div class="flex flex-1 items-end justify-center gap-1">${series.map((list, k) => `<div class="w-full max-w-10 rounded-t" style="height:${list[i] / max * 100}%;background:${colors[k]}"></div>`).join('')}</div><span class="text-center text-[11px] text-neutral-400">${l}</span></div>`).join('')}</div>`
const pie = parts => {
  const total = parts.reduce((sum, p) => sum + p[1], 0)
  let offset = 25
  const slices = parts.map(([, v, c]) => { const pct = v / total * 100; const slice = `<circle cx="32" cy="32" r="15.9155" fill="none" stroke="${c}" stroke-width="31.8" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${offset}"/>`; offset -= pct; return slice }).join('')
  return `<div class="flex flex-col items-center gap-6 @md:flex-row @md:justify-center"><svg viewBox="0 0 64 64" class="h-44 w-44">${slices}</svg><div class="space-y-1 text-sm">${parts.map(([l, v, c]) => `<p class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full" style="background:${c}"></span>${l} (${Math.round(v / total * 100)}%)</p>`).join('')}</div></div>`
}
const radio = (label, on) => `<span class="inline-flex items-center gap-2 text-sm whitespace-nowrap"><span class="flex h-4 w-4 items-center justify-center rounded-full border-2 border-neutral-900">${on ? '<span class="h-2 w-2 rounded-full bg-neutral-900"></span>' : ''}</span>${label}</span>`

const roles = {
  employe: { name: 'Employé', user: 'John Doe', nav: [['clock', 'Pointage'], ['calendar-days', 'Mes temps'], ['calendar-range', 'Planning'], ['plane', 'Absences'], ['chart-column', 'Statistiques']] },
  manager: { name: 'Manager', user: 'Jim Gordon', nav: [['users', 'Équipe'], ['bell', 'Alertes'], ['check-check', 'Validation'], ['calendar-range', 'Planning'], ['chart-column', 'Statistiques']] },
  admin: { name: 'Administrateur / RH', user: 'Albert P.', nav: [['user-cog', 'Utilisateurs'], ['sliders-horizontal', 'Règles'], ['banknote', 'Paie'], ['plane', 'Absences']] },
}

const login = `<div class="flex flex-1 items-center justify-center p-4"><div class="w-full max-w-sm rounded-2xl bg-white p-8">
  <div class="mb-8 flex items-center gap-3"><div class="flex h-10 w-10 items-center justify-center rounded-xl bg-neutral-900 text-white">${ic('clock')}</div><span class="text-xl font-bold">Time Manager</span></div>
  <p class="text-2xl font-semibold">Connexion</p><p class="mt-1 text-sm text-neutral-400">Ville de Gotham · Espace agent</p>
  <p class="mt-6 text-sm text-neutral-500">Email</p><div class="field">exemple@gotham.gov</div>
  <p class="mt-3 text-sm text-neutral-500">Mot de passe</p><div class="field flex items-center justify-between"><span>••••••••••</span>${ic('eye')}</div>
  <p class="mt-2 text-right text-sm font-medium underline">Mot de passe oublié ?</p>
  <div class="btn mt-4 w-full py-3">Se connecter</div>
  <div class="mt-6 rounded-2xl border-2 border-neutral-900 p-4"><p class="flex items-center gap-2 text-sm font-semibold">${ic('accessibility')} Accessibilité</p>
    <div class="mt-3 grid grid-cols-3 gap-2 text-center text-[11px] leading-tight"><div class="rounded-lg bg-neutral-900 px-1 py-2 text-white">Contraste élevé</div><div class="rounded-lg bg-neutral-100 py-2">Texte A+</div><div class="rounded-lg bg-neutral-100 py-2">Lecture vocale</div></div></div>
  <p class="mt-6 flex items-center justify-center gap-2 text-sm text-neutral-500">${ic('circle-help')} Première connexion ? Suivre le tutoriel</p>
</div></div>`

const screens = [
  { role: 'employe', title: 'Connexion', login: true,
    notes: ['<b>Employé malvoyant</b> : contraste, taille du texte et lecture vocale dès la connexion.', '<b>Employé senior</b> : accès sécurisé par mot de passe, avec récupération en cas d\'oubli.', '<b>Employé senior, Syndicat</b> : tutoriel guidé, aucune compétence informatique requise.'] },

  { role: 'employe', title: 'Pointage',
    notes: ['<b>Jardinier, éboueurs, policiers</b> : pointage sur téléphone, même sans réseau.', '<b>Lettre de plainte</b> : un seul bouton, aucune saisie ligne par ligne.', '<b>Pause déjeuner, contractuel du campus</b> : pause et trajet déclarés en un clic.', '<b>John Doe</b> : bouton Incident pour justifier un retard dû à Batman.', '<b>Jardinier sans téléphone</b> : « Journée conforme au planning » en un clic depuis la borne de l\'entrepôt.'],
    html: `<div class="grid grid-cols-1 gap-6 @3xl:grid-cols-3">
      <div class="space-y-6">
        <div class="card flex flex-col items-center p-6 @3xl:p-8">${dark('En cours')}
          <p class="mt-6 text-5xl font-bold tracking-tight tabular-nums @3xl:text-6xl">03:25:17</p>
          <p class="mt-2 text-sm text-neutral-400">Depuis 08:02</p>
          <div class="btn-o mt-6 w-full py-3 text-base">Pointer la sortie</div>
          <div class="mt-3 grid w-full grid-cols-3 gap-2 text-xs"><div class="flex flex-col items-center gap-1 rounded-xl bg-neutral-100 py-2">${ic('coffee')}Pause</div><div class="flex flex-col items-center gap-1 rounded-xl bg-neutral-100 py-2">${ic('footprints')}Trajet</div><div class="flex flex-col items-center gap-1 rounded-xl bg-neutral-100 py-2">${ic('triangle-alert')}Incident</div></div>
          <div class="btn-s mt-3 w-full py-2.5">${ic('calendar-check')} Journée conforme au planning (05:00 – 13:00)</div>
        </div>
        <div class="card"><div class="flex items-center justify-between"><p class="font-medium">Objectif du jour</p><span class="text-sm text-neutral-400">49%</span></div>
          <p class="mt-4 text-3xl font-semibold">3h 25m <span class="text-base font-normal text-neutral-400">/ 7h</span></p>
          <div class="mt-4 h-2 rounded-full bg-neutral-100"><div class="h-2 w-[49%] rounded-full bg-neutral-900"></div></div>
          <p class="mt-3 text-sm text-neutral-500">Tu peux partir à 15:37</p></div>
      </div>
      <div class="space-y-6 @3xl:col-span-2">
        <div class="card"><p class="mb-4 font-medium">Dernières sessions</p>${table(['Date', 'Arrivée', 'Sortie', 'Durée'], [['2026-09-29', '08:10', '12:04', '3h 54m'], ['2026-09-28', '13:20', '17:31', '4h 11m'], ['2026-09-28', '08:12', '12:07', '3h 55m'], ['2026-09-25', '22:00', '04:00 ' + dark('Nuit'), '6h 00m']])}</div>
        <div class="card flex items-center gap-3 text-sm text-neutral-500">${ic('wifi-off')} Pas de réseau ? Le pointage est gardé sur l'appareil et envoyé au retour de la connexion.</div>
      </div></div>` },

  { role: 'employe', title: 'Mes temps',
    notes: ['<b>Manager de nuit</b> : l\'employé ne modifie plus ses heures lui-même, il consulte et propose.', '<b>Manager (oubli de pointage)</b> : sortie manquante signalée, correction demandée en quelques clics.', '<b>Jardinier</b> : heures non pointées déclarées après coup, puis décidées par le manager.', '<b>Syndicat</b> : historique visible par l\'employé, refus toujours motivé.'],
    html: `<div class="space-y-6">${stats(['clock', 'Heures totales', '319h 44m', 'Depuis le début'], ['calendar-check', 'Jours travaillés', '44', 'Depuis le début'], ['trending-up', 'Moyenne par jour', '7h 16m', 'Depuis le début'], ['inbox', 'Corrections', '1', 'En attente'])}
      <div class="grid grid-cols-1 gap-6 @3xl:grid-cols-3">
        <div class="space-y-6">
          <div class="card"><p class="mb-1 font-medium">Demander une correction</p><p class="mb-4 text-xs text-neutral-500">Ton manager accepte, modifie ou refuse sous 48 h.</p>
            <p class="text-sm text-neutral-500">Session concernée</p><div class="field">mar. 29 sept. · arrivée 08:02</div>
            <p class="mt-3 text-sm text-neutral-500">Type de demande</p><div class="field flex items-center justify-between text-neutral-900">Pointage oublié ${ic('chevron-down')}</div>
            <p class="mt-3 text-sm text-neutral-500">Heure de sortie proposée</p><div class="field text-neutral-900">17:00</div>
            <p class="mt-3 text-sm text-neutral-500">Motif</p><div class="field text-neutral-900">J'ai oublié de pointer en partant.</div>
            <div class="btn mt-4 w-full">Envoyer la demande</div></div>
          <div class="card"><p class="mb-3 font-medium">Historique</p><div class="space-y-3 text-xs text-neutral-500"><p><span class="font-medium text-neutral-900">30 sept.</span> · Sortie du 21 sept. fixée à 17:00 par Jim Gordon, à ta demande.</p><p><span class="font-medium text-neutral-900">24 sept.</span> · Demande refusée : « Le planning indiquait un repos ce jour-là. »</p></div></div>
        </div>
        <div class="card @3xl:col-span-2"><div class="mb-4 flex flex-wrap items-center justify-between gap-2"><p class="font-medium">Mes sessions <span class="text-neutral-400">(84)</span></p><span class="flex items-center gap-1 text-xs text-neutral-500">${ic('lock')} Lecture seule</span></div>
          ${table(['Date', 'Horaires', 'Durée', 'Statut', ''], [['mar. 29 sept.', '08:02 → ?', '—', red('Sortie manquante'), dark('Corriger')], ['lun. 28 sept.', '08:10 → 17:31', '8h 05m', chip('Pointée'), ''], ['ven. 25 sept.', '22:00 → 04:00', '6h 00m', dark('Nuit'), ''], ['mer. 23 sept.', '05:00 → 14:30', '9h 30m', chip('Correction en attente'), ''], ['mar. 22 sept.', '05:00 → 13:00', '8h 00m', chip('Déclarée'), ''], ['lun. 21 sept.', '08:18 → 17:00', '8h 42m', green('Corrigée par J. Gordon'), '']])}</div>
      </div></div>` },

  { role: 'employe', title: 'Planning',
    notes: ['<b>Policier père de famille</b> : planning publié à l\'avance pour organiser sa vie de famille.', '<b>Équipe sanitaire, commissaire Gordon</b> : compteur de nuits avec plafond, repos après une nuit.', '<b>Manager (astreintes)</b> : astreintes distinguées des heures sup.'],
    html: `<div class="space-y-6">
      <div class="card flex flex-wrap items-center justify-between gap-3"><p class="flex items-center gap-2 text-sm">${ic('calendar-check')} Semaine du 5 octobre · publié le 21 septembre, 2 semaines à l'avance</p><div class="flex gap-2">${chip('Jour')}${dark('Nuit')}<span class="chip border border-neutral-900 bg-white">Astreinte</span></div></div>
      <div class="grid grid-cols-1 gap-3 @3xl:grid-cols-7">${[['Lun 5', '08:00 – 16:00', 'Jour', 'bg-white'], ['Mar 6', '08:00 – 16:00', 'Jour', 'bg-white'], ['Mer 7', '22:00 – 06:00', 'Nuit', 'bg-neutral-900 text-white'], ['Jeu 8', 'Repos', 'Après une nuit', 'border-2 border-dashed border-neutral-400 text-neutral-500'], ['Ven 9', '18:00 – 08:00', 'Astreinte', 'border-2 border-neutral-900 bg-white'], ['Sam 10', '—', 'Repos', 'text-neutral-400'], ['Dim 11', '—', 'Repos', 'text-neutral-400']].map(d => `<div class="flex items-center justify-between rounded-2xl p-4 @3xl:block @3xl:min-h-32 ${d[3]}"><p class="text-sm font-semibold">${d[0]}</p><div class="text-right @3xl:mt-6 @3xl:text-left"><p class="text-sm font-medium">${d[1]}</p><p class="text-xs opacity-70">${d[2]}</p></div></div>`).join('')}</div>
      ${stats(['moon', 'Nuits ce mois-ci', '3 / 6', 'Plafond fixé par les règles'], ['repeat', 'Nuits consécutives', '1 / 2', 'Maximum autorisé'], ['phone-call', 'Astreintes', '1', 'Non comptées en heures sup'], ['clock', 'Heures prévues', '32h', 'Cette semaine'])}
    </div>` },

  { role: 'employe', title: 'Absences',
    notes: ['<b>Employée RH</b> : congés, jours off et arrêts maladie gérés dans l\'app, sans paperasse.', '<b>DRH</b> : heures à récupérer (non payées) visibles par l\'employé.'],
    html: `<div class="space-y-6">${stats(['plane', 'Congés restants', '14 j', 'Sur 25 jours'], ['hourglass', 'Récupération', '6h 30m', 'Heures à récupérer'], ['thermometer', 'Arrêts maladie', '1', 'Cette année'], ['inbox', 'Demandes', '1', 'En attente'])}
      <div class="flex flex-col gap-3 @3xl:flex-row"><div class="btn py-3">${ic('plane')} Demander un congé</div><div class="btn-o py-3">${ic('thermometer')} Déclarer un arrêt maladie</div><div class="btn-o py-3">${ic('hourglass')} Poser une récupération</div></div>
      <div class="card"><p class="mb-4 font-medium">Mes demandes</p>${table(['Période', 'Type', 'Durée', 'Statut'], [['12 – 16 oct.', 'Congé', '5 jours', green('Validé')], ['2 nov.', 'Récupération', '6h 30m', chip('En attente')], ['7 sept.', 'Arrêt maladie', '1 jour', chip('Justificatif reçu')]])}</div></div>` },

  { role: 'employe', title: 'Statistiques',
    notes: ['<b>Tweets anonymes</b> : l\'outil sert d\'abord l\'employé, aucun classement entre collègues.', '<b>Sujet</b> : graphiques configurables, le type de chaque graphique se change.', '<b>Managers (heures sup non payées)</b> : les heures sup restent visibles par l\'employé.', '<b>John Doe, DRH</b> : impact sur la fiche de paie affiché clairement.'],
    html: `<div class="space-y-8">
      <div>${secTitle('clock', 'Statistiques des Pointages')}<div class="grid grid-cols-1 gap-6 @3xl:grid-cols-2">
        ${chartCard('clock', 'bg-blue-50 text-blue-600', 'Horaires de pointage', "Heures d'arrivée et de départ sur 7 jours", 'Ligne', lineChart(['lun. 21', 'mar. 22', 'mer. 23', 'jeu. 24', 'ven. 25', 'sam. 26', 'lun. 28'], [8.2, 8.5, 8.1, 8.3, 8.2, 9.3, 8.1], [17.5, 17.2, 17.8, 17.5, 17.3, 12.5, 17.5]))}
        ${chartCard('chart-column', 'bg-indigo-50 text-indigo-600', 'Fréquence des pointages', 'Nombre de Clock In / Clock Out par heure', 'Barres', colBars(['07h', '08h', '09h', '12h', '13h', '17h'], [[1, 40, 4, 0, 40, 0], [0, 0, 0, 44, 0, 40]], 44, ['#10b981', '#ef4444'], ['Clock In', 'Clock Out']))}
      </div></div>
      <div>${secTitle('calendar-days', 'Statistiques des Temps de Travail')}<div class="grid grid-cols-1 gap-6 @3xl:grid-cols-2">
        ${chartCard('calendar-days', 'bg-sky-50 text-sky-600', 'Durée travaillée par jour', 'Heures cumulées par journée de travail', 'Barres', colBars(['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'], [[62, 59, 61, 60, 61, 13]], 70, ['#2563eb'], ['Heures travaillées (h)']))}
        ${chartCard('chart-pie', 'bg-purple-50 text-purple-600', 'Répartition du temps travaillé', 'Proportion (%) du temps total par jour', 'Camembert', pie([['Lundi', 62, '#2563eb'], ['Mardi', 59, '#38bdf8'], ['Mercredi', 61, '#818cf8'], ['Jeudi', 60, '#c084fc'], ['Vendredi', 61, '#f43f5e'], ['Samedi', 13, '#10b981']]))}
      </div></div>
      <div class="card"><p class="mb-3 font-medium">Ma fiche de paie estimée · septembre</p>
        <div class="grid grid-cols-2 gap-4 text-sm @3xl:grid-cols-4"><div><p class="text-neutral-500">Heures normales</p><p class="text-xl font-semibold">129h 30m</p></div><div><p class="text-neutral-500">Nuit (× 1,5)</p><p class="text-xl font-semibold">24h 00m</p></div><div><p class="text-neutral-500">Heures sup (× 2)</p><p class="text-xl font-semibold">2h 40m</p></div><div><p class="text-neutral-500">À récupérer</p><p class="text-xl font-semibold">6h 30m</p></div></div>
        <p class="mt-4 flex items-start gap-2 text-xs text-neutral-500">${ic('lock')} Ces chiffres sont pour toi. Aucune comparaison avec tes collègues.</p></div>
    </div>` },

function userBadge(role, mobile) {
  const user = roles[role].user

  if (s.login) return `<div class="${frame}">${login}</div>`
  return `<div class="${frame}">
    <header class="flex h-16 shrink-0 items-center justify-between border-b border-neutral-200 bg-white px-4"><div class="flex items-center gap-3">${ic('menu')}<h1 class="text-lg font-semibold">${s.title}</h1></div>${userBadge(s.role, true)}</header>
    <main class="@container flex-1 p-4">${s.html}</main></div>`
}

let lastRole = ''
document.getElementById('app').innerHTML = `
  <header class="mb-12"><p class="text-sm font-medium tracking-wider text-neutral-500 uppercase">Time Manager · Ville de Gotham</p><h1 class="mt-1 text-4xl font-bold">Maquettes par rôle : web et mobile</h1><p class="mt-2 text-neutral-600">Chaque écran indique les besoins utilisateurs auxquels il répond.</p></header>` +
  screens.map((s, index) => {
    const roleTitle = s.role !== lastRole ? `<h2 class="mt-20 mb-8 border-b-4 border-neutral-900 pb-3 text-3xl font-bold">Rôle : ${roles[s.role].name}</h2>` : ''
    lastRole = s.role
    return `${roleTitle}<section class="mb-16">
      <h3 class="text-xl font-semibold">${roles[s.role].name} · ${s.title}</h3>
      <div class="mt-3 mb-6 flex max-w-[1710px] flex-wrap gap-2">${s.notes.map(n => `<p class="note">${n}</p>`).join('')}</div>
      <div class="flex items-start gap-10"><div><p class="mb-2 text-sm font-medium text-neutral-500">Web</p>${web(s)}</div><div><p class="mb-2 text-sm font-medium text-neutral-500">Mobile</p>${mobile(s)}</div></div>
    </section>`
  }).join('')
lucide.createIcons()
</script>
</body>
</html>
